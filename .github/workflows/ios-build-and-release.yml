name: Build & Release iOS (SavingGoalPlus)

on:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/scripts/release-version.sh'
      - '.github/workflows/ios-build-and-release.yml'
    tags:
      - 'v*'
      - 'ios-v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/scripts/release-version.sh'
      - '.github/workflows/ios-build-and-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target Version (e.g. 1.0.0, 1.0.1). Leave blank to auto-bump patch.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-and-release:
    name: Test, Archive & Release Native iOS
    runs-on: macos-latest
    permissions:
      contents: write
    concurrency:
      group: ios-build-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Compute Target Version
        if: github.event_name != 'pull_request'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/release-version.sh ios

      - name: Cache Swift Package Manager Dependencies
        uses: actions/cache@v4
        with:
          path: ios/.spm-cache
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/Package.swift', 'ios/SavingGoalPlus.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Packages & Verify Scheme
        run: |
          cd ios
          xcodebuild -list -project SavingGoalPlus.xcodeproj
          xcodebuild -resolvePackageDependencies \
            -project SavingGoalPlus.xcodeproj \
            -scheme SavingGoalPlus \
            -clonedSourcePackagesDirPath .spm-cache

      - name: Compile App, Widget & Unit Tests (Simulator)
        run: |
          cd ios
          xcodebuild build-for-testing \
            -project SavingGoalPlus.xcodeproj \
            -scheme SavingGoalPlus \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Archive & Package Unsigned .ipa and .xcarchive
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p build_output
          cd ios
          xcodebuild archive \
            -project SavingGoalPlus.xcodeproj \
            -scheme SavingGoalPlus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "../build_output/SavingGoalPlus.xcarchive" \
            -clonedSourcePackagesDirPath .spm-cache \
            MARKETING_VERSION="${RELEASE_VERSION}" \
            CURRENT_PROJECT_VERSION="1" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          cd ../build_output

          # Package installable unsigned .ipa (includes SavingGoalPlusWidget inside PlugIns/)
          mkdir -p Payload
          APP_PATH=$(find SavingGoalPlus.xcarchive/Products/Applications -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r "SavingGoalPlus-v${RELEASE_VERSION}-unsigned.ipa" Payload
          rm -rf Payload

          # Package raw .xcarchive.zip
          zip -r "SavingGoalPlus-v${RELEASE_VERSION}-iOS.xcarchive.zip" SavingGoalPlus.xcarchive
          rm -rf SavingGoalPlus.xcarchive

      - name: Upload CI Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SavingGoalPlus-v${{ env.RELEASE_VERSION }}-iOS
          path: |
            build_output/*.ipa
            build_output/*.zip

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_output/*.ipa
            build_output/*.zip
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          make_latest: ${{ startsWith(env.RELEASE_TAG, 'ios-v') && 'false' || 'legacy' }}
          name: "SavingGoalPlus v${{ env.RELEASE_VERSION }}${{ startsWith(env.RELEASE_TAG, 'ios-v') && ' (iOS)' || '' }}"
          generate_release_notes: true
          draft: false
          prerelease: false
