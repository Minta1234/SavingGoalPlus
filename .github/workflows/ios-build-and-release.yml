name: Build & Release iOS (SavingGoalPlus)

on:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build-and-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build-and-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target Version (e.g. 1.0.0, 1.0.1). Leave blank to auto-bump patch.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test, Archive & Release Native iOS
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Compute Target Version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            TARGET_VERSION=$(echo "$INPUT_VERSION" | sed 's/^v//')
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
            CLEAN_TAG=$(echo "$LATEST_TAG" | sed 's/^v//')
            if [[ "$CLEAN_TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              TARGET_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              TARGET_VERSION="1.0.0"
            fi
          fi
          echo "RELEASE_VERSION=${TARGET_VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${TARGET_VERSION}" >> $GITHUB_ENV
          echo "Resolved Version: v${TARGET_VERSION}"

      - name: Cache Swift Package Manager Dependencies
        uses: actions/cache@v4
        with:
          path: ios/.spm-cache
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/Package.swift', 'ios/SavingGoalPlus.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Packages & Verify Scheme
        run: |
          cd ios
          xcodebuild -list -project SavingGoalPlus.xcodeproj
          xcodebuild -resolvePackageDependencies \
            -project SavingGoalPlus.xcodeproj \
            -scheme SavingGoalPlus \
            -clonedSourcePackagesDirPath .spm-cache

      - name: Compile App, Widget & Unit Tests (Simulator)
        run: |
          cd ios
          xcodebuild build-for-testing \
            -project SavingGoalPlus.xcodeproj \
            -scheme SavingGoalPlus \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Archive & Package Unsigned .ipa and .xcarchive
        run: |
          mkdir -p build_output
          cd ios
          xcodebuild archive \
            -project SavingGoalPlus.xcodeproj \
            -scheme SavingGoalPlus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "../build_output/SavingGoalPlus.xcarchive" \
            -clonedSourcePackagesDirPath .spm-cache \
            MARKETING_VERSION="${RELEASE_VERSION}" \
            CURRENT_PROJECT_VERSION="1" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          cd ../build_output

          # Package installable unsigned .ipa (includes SavingGoalPlusWidget inside PlugIns/)
          mkdir -p Payload
          APP_PATH=$(find SavingGoalPlus.xcarchive/Products/Applications -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r "SavingGoalPlus-v${RELEASE_VERSION}-unsigned.ipa" Payload
          rm -rf Payload

          # Package raw .xcarchive.zip
          zip -r "SavingGoalPlus-v${RELEASE_VERSION}-iOS.xcarchive.zip" SavingGoalPlus.xcarchive
          rm -rf SavingGoalPlus.xcarchive

      - name: Upload CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SavingGoalPlus-v${{ env.RELEASE_VERSION }}-iOS
          path: |
            build_output/*.ipa
            build_output/*.zip

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_output/*.ipa
            build_output/*.zip
          tag_name: ${{ env.RELEASE_TAG }}
          name: "SavingGoalPlus v${{ env.RELEASE_VERSION }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          