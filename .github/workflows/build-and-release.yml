name: Build & Release SavingGoalPlus

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/scripts/release-version.sh'
      - '.github/workflows/build-and-release.yml'
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/scripts/release-version.sh'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target Version (e.g. 1.0.0, 1.0.1, 1.0.2). Leave blank to auto-bump patch.'
        required: false
        default: ''
      bump_type:
        description: 'Auto-bump type if target version is blank'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
permissions:
  contents: read

jobs:
  build:
    name: Test & Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-build-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: bash gradlew testDebugUnitTest --stacktrace

      - name: Build pull request APK
        if: github.event_name == 'pull_request'
        run: bash gradlew assembleDebug --stacktrace

      - name: Resolve release version
        if: github.event_name != 'pull_request'
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUMP_TYPE: ${{ inputs.bump_type || 'patch' }}
        run: bash .github/scripts/release-version.sh android

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Configure RELEASE_KEYSTORE_BASE64 with the existing release key."
            exit 1
          fi
          [[ -n "$KEYSTORE_PASSWORD" ]] || unset KEYSTORE_PASSWORD
          [[ -n "$KEY_ALIAS" ]] || unset KEY_ALIAS
          [[ -n "$KEY_PASSWORD" ]] || unset KEY_PASSWORD
          trap 'rm -f app/release.keystore' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          bash gradlew assembleRelease -PversionName="$RELEASE_VERSION" -PversionCode="$RELEASE_CODE" --stacktrace
          mkdir -p release_dist
          cp app/build/outputs/apk/release/app-release.apk "release_dist/SavingGoalPlus-v${RELEASE_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SavingGoalPlus-APKs
          if-no-files-found: error
          path: |
            release_dist/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Publish Android release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*.apk
          fail_on_unmatched_files: true
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "SavingGoalPlus v${{ env.RELEASE_VERSION }}"
          generate_release_notes: true
